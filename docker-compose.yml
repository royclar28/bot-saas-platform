version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: saas_postgres
    environment:
      POSTGRES_USER: saas_user
      POSTGRES_PASSWORD: saas_password
      POSTGRES_DB: saas_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # ports:
    #  - "5432:5432" # Comentado para evitar choque con bases de datos existentes
    restart: unless-stopped
    networks:
      - saas_network

  redis:
    image: redis:7-alpine
    container_name: saas_redis
    
    volumes:
      - redis_data:/data
    # ports:
    #  - "6379:6379" # Comentado para evitar choque
    restart: unless-stopped
    networks:
      - saas_network

  evolution-api:
    image: evoapicloud/evolution-api:v2.2.0
    container_name: saas_evolution_api
    depends_on:
      - db
      - redis
    environment:
      - SERVER_URL=http://localhost:8080
      - DOCKER_ENV=true
      - LOG_LEVEL=ERROR
      - AUTHENTICATION_API_KEY=evolution_secret_key
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://saas_user:saas_password@db:5432/saas_db?schema=evolution
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379/1
      - CACHE_REDIS_PREFIX_KEY=evo
      - CACHE_LOCAL_ENABLED=false
      - REDIS_ENABLED=true
      - REDIS_URI=redis://redis:6379/2
      - REDIS_PREFIX_KEY=evo
      - RABBITMQ_ENABLED=false
    # ports:
    #  - "8080:8080"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      - "traefik.http.routers.http-0-evolution_api.entryPoints=http"
      - "traefik.http.routers.http-0-evolution_api.rule=Host(`waba.merxpos.com`)"
      - "traefik.http.routers.http-0-evolution_api.service=http-0-evolution_api"
      - "traefik.http.routers.https-0-evolution_api.entryPoints=https"
      - "traefik.http.routers.https-0-evolution_api.rule=Host(`waba.merxpos.com`)"
      - "traefik.http.routers.https-0-evolution_api.service=https-0-evolution_api"
      - "traefik.http.routers.https-0-evolution_api.tls=true"
      - "traefik.http.routers.https-0-evolution_api.tls.certresolver=letsencrypt"
      - "traefik.http.services.http-0-evolution_api.loadbalancer.server.port=8080"
      - "traefik.http.services.https-0-evolution_api.loadbalancer.server.port=8080"
    restart: unless-stopped
    networks:
      - saas_network
      - coolify
    volumes:
      - evolution_instances:/evolution/instances

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: saas_backend
    depends_on:
      - db
      - redis
      - evolution-api
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=3333
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=saas_user
      - DB_PASSWORD=saas_password
      - DB_DATABASE=saas_db
      - REDIS_HOST=redis
            - REDIS_PORT=6379
      - EVOLUTION_API_URL=http://evolution-api:8080
      - EVOLUTION_API_KEY=evolution_secret_key
      - APP_KEY=oI18vJq6Qo12sQ1hL1vB_mZ1hK1vJq6Q
      - LOG_LEVEL=info
      - API_SECRET_KEY=super_secret_bot_key_123
      - LLM_API_KEY=sk-dummy-llm-key
      - EVOLUTION_INSTANCE_NAME=MerxBotSaaS

    # ports:
    #  - "3333:3333"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      - "traefik.http.routers.http-0-backend.entryPoints=http"
      - "traefik.http.routers.http-0-backend.rule=Host(`api-bot.merxpos.com`)"
      - "traefik.http.routers.http-0-backend.service=http-0-backend"
      - "traefik.http.routers.https-0-backend.entryPoints=https"
      - "traefik.http.routers.https-0-backend.rule=Host(`api-bot.merxpos.com`)"
      - "traefik.http.routers.https-0-backend.service=https-0-backend"
      - "traefik.http.routers.https-0-backend.tls=true"
      - "traefik.http.routers.https-0-backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.http-0-backend.loadbalancer.server.port=3333"
      - "traefik.http.services.https-0-backend.loadbalancer.server.port=3333"
    restart: unless-stopped
    networks:
      - saas_network
      - coolify

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: saas_frontend
    depends_on:
      - backend
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_API_URL=https://api-bot.merxpos.com/api/admin
      - AUTH_SECRET=my_super_secret_auth_key_123456
      - ADMIN_PASSWORD=admin123
      - AUTH_TRUST_HOST=true
      - AUTH_URL=https://bot.merxpos.com
    # ports:
    #  - "3000:3000"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      - "traefik.http.routers.http-0-frontend.entryPoints=http"
      - "traefik.http.routers.http-0-frontend.rule=Host(`bot.merxpos.com`)"
      - "traefik.http.routers.http-0-frontend.service=http-0-frontend"
      - "traefik.http.routers.https-0-frontend.entryPoints=https"
      - "traefik.http.routers.https-0-frontend.rule=Host(`bot.merxpos.com`)"
      - "traefik.http.routers.https-0-frontend.service=https-0-frontend"
      - "traefik.http.routers.https-0-frontend.tls=true"
      - "traefik.http.routers.https-0-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.http-0-frontend.loadbalancer.server.port=3000"
      - "traefik.http.services.https-0-frontend.loadbalancer.server.port=3000"
    restart: unless-stopped
    networks:
      - saas_network
      - coolify

volumes:
  postgres_data:
  redis_data:
  evolution_instances:

networks:
  saas_network:
    driver: bridge
  coolify:
    external: true
